<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            color: white;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        h3 {
            margin-top: 20px;
            font-size: 18px;
        }

        p {
            font-size: 14px;
            margin-bottom: 10px;
        }

        a {
            display: inline-block;
            margin: 8px 5px;
            padding: 10px 15px;
            text-decoration: none;
            color: white;
            background: #ff7eb3;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #ff4f91;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Admin Dashboard</h1>

            <a href="{% url 'view_leaves' %}">View Leave Requests</a>
            <a href="{% url 'logout' %}">Logout</a>

            <h3>Total Leave Requests</h3>
            <p>Manage all staff leave applications</p>
            <a href="{% url 'view_leaves' %}">Open</a>

            <h3>Staff Management</h3>
            <p>View registered staff users</p>
            <a href="{% url 'manage_staff' %}">Manage Staff</a>
        </div>
    </div>
</body>
</html>
