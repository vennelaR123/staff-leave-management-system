<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Leave Applications</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-transform: capitalize;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        tr:hover {
            background: #e6e6ff;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        .empty {
            text-align: center;
            font-weight: bold;
            color: #999;
            padding: 15px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background: #764ba2;
            padding: 10px;
            border-radius: 6px;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        a:hover {
            background: #5a3780;
        }
    </style>

</head>

<body>

    <div class="container">
        <h2>My Leave Application</h2>

        <table>
            <tr>
                <th>Leave Type</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Reason</th>
                <th>Status</th>
            </tr>

            {% for leave in leaves %}
            <tr>
                <td>{{ leave.leave_type }}</td>
                <td>{{ leave.start_date }}</td>
                <td>{{ leave.end_date }}</td>
                <td>{{ leave.reason }}</td>
                <td>{{ leave.status }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="empty">No leave application found</td>
            </tr>
            {% endfor %}
        </table>

        <a href="{% url 'staff_dashboard'%}">Back to Dashboard</a>
    </div>

</body>
</html>
