<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLMS</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #060708, #ad2c98);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            text-align: center;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            width: 320px;
            transition: 0.3s;
            color: white;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 34px;
            letter-spacing: 2px;
        }

        p {
            margin-bottom: 30px;
            font-size: 14px;
            color: #f1f1f1;
        }

        .btn {
            display: block;
            margin: 12px 0;
            padding: 12px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .login {
            background: linear-gradient(to right, #ff758c);
        }

        .register {
            background: linear-gradient(to right, #43e97b);
        }

        .btn:hover {
            transform: scale(1.05);
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #e0e0e0;
        }
    </style>
</head>

<body>

    <div class="container">
        
        <div class="card">
            
            <h1>SLMS</h1>
            
            <p>
                Staff Leave Management System
            </p>
            <a href="{% url 'login' %}" class="btn login">
               Login
            </a>
            <a href="{% url 'register' %}" class="btn register">
               Register
            </a>
            <footer>
                © 2026 Dhee Coding Lab (DCL) | All Rights Reserved
            </footer>

        </div>

    </div>

</body>
</html>
