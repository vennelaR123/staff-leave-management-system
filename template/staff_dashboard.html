<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        nav {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .welcome {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            margin: 20px auto;
            padding: 20px;
            width: 300px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .card h5 {
            margin: 10px 0;
            font-size: 18px;
        }

        .card p {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            padding: 8px 14px;
            background: #ff7eb3;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff4f91;
        }
    </style>
</head>

<body>
    <nav>
        <a>SLMS - Staff</a>
        <a href="{% url 'logout' %}">Logout</a>
    </nav>

    <div class="container">
        <div class="welcome">
            Welcome, {{ request.user.username }}
        </div>

        <div class="card">
            <h5>Apply Leave</h5>
            <p>Submit a new leave request</p>
            <a href="{% url 'apply_leave' %}" class="btn">Apply</a>
        </div>

        <div class="card">
            <h5>My Leave Status</h5>
            <p>View your leave requests</p>
            <a href="{% url 'my_leaves' %}" class="btn">View</a>
        </div>
    </div>
</body>
</html>
