<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Staff</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .container {
            width: 80%;
            margin: 50px auto;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            padding: 8px 14px;
            margin: 5px;
            border-radius: 6px;
            color: white;
            background-color: #ff7eb3;
            transition: 0.3s;
            display: inline-block;
        }

        a:hover {
            background-color: #ff4f91;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: rgba(0, 0, 0, 0.3);
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.05);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .btn-delete {
            background-color: #ff4d4d;
        }

        .btn-delete:hover {
            background-color: #cc0000;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            background-color: #4caf50;
        }

        .back-link:hover {
            background-color: #388e3c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Manage Staff</h2>

        <a href="{% url 'add_staff' %}">Add Staff</a>
        <table>
            <tr>
                <th>Username</th>
                <th>Actions</th>
            </tr>

            {% for staff in staff_list %}
            <tr>
                <td>{{ staff.username }}</td>
                <td>
                    <a href="{% url 'edit_staff' staff.id %}">Edit</a>

                    <a href="{% url 'delete_staff' staff.id %}" 
                       class="btn-delete"
                       onclick="return confirm('Are you sure?')">
                       Delete
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">No staff found</td>
            </tr>
            {% endfor %}
        </table>
        <a href="{% url 'admin_dashboard' %}" class="back-link">
            Back to Dashboard
        </a>
    </div>
</body>
</html>
